<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2026 KBO 야구 동아리 축제</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // =========================================================================
    // [Vercel / GitHub 외부 배포용 Supabase 설정]
    // 아래에 직접 붙여넣거나, 배포 후 [👑 운영진 관리실]에서 입력해 연결할 수 있습니다!
    // =========================================================================
    const SUPABASE_URL = "";
    const SUPABASE_ANON_KEY = "";

    window.__cloudBridge = {
      ready: false,
      statusText: '🟡 Supabase 설정 대기 중 (운영진 관리실에서 URL/Key 입력 필요)',
      client: null,
      usersCache: {},
      rankingsCache: []
    };

    function getActiveSupabaseConfig() {
      const hashParams = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
      const queryParams = new URLSearchParams(window.location.search || '');
      const url = SUPABASE_URL || queryParams.get('sb_url') || hashParams.get('sb_url') || window.__runtimeSbUrl || "";
      const key = SUPABASE_ANON_KEY || queryParams.get('sb_key') || hashParams.get('sb_key') || window.__runtimeSbKey || "";
      return { url: url.trim(), key: key.trim() };
    }

    async function initSupabaseSync(customUrl = "", customKey = "") {
      try {
        if (customUrl && customKey) {
          window.__runtimeSbUrl = customUrl.trim();
          window.__runtimeSbKey = customKey.trim();
        }
        const { url, key } = getActiveSupabaseConfig();
        if (!url || !key || !window.supabase) {
          updateCloudStatusBadge();
          return false;
        }

        const client = window.supabase.createClient(url, key);
        window.__cloudBridge.client = client;

        await fetchSupabaseAll(true);

        window.__cloudBridge.ready = true;
        window.__cloudBridge.statusText = '🟢 Supabase 실시간 클라우드 연결 완료 (전 기기 동기화 중)';
        updateCloudStatusBadge();

        client
          .channel('festival-live-sync')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'festival_users' }, () => fetchSupabaseAll())
          .on('postgres_changes', { event: '*', schema: 'public', table: 'festival_rankings' }, () => fetchSupabaseAll())
          .subscribe();
        return true;
      } catch (e) {
        console.warn('Supabase init error:', e);
        window.__cloudBridge.ready = false;
        window.__cloudBridge.statusText = '🔴 Supabase 연결 실패: ' + (e.message || 'URL/Key 또는 테이블을 확인하세요');
        updateCloudStatusBadge();
        return false;
      }
    }

    async function fetchSupabaseAll(throwOnError = false) {
      const client = window.__cloudBridge.client;
      if (!client) return;

      const { data: usersData, error: uErr } = await client.from('festival_users').select('*');
      if (uErr && throwOnError) throw uErr;
      if (!uErr && Array.isArray(usersData)) {
        const map = {};
        usersData.forEach(row => {
          map[row.username] = {
            pin: row.pin,
            points: row.points ?? 500,
            unlockedTeams: row.unlocked_teams || ['KIA'],
            upgrades: row.upgrades || { power: 1, contact: 1, pitch: 1 },
            stats: row.stats || { hr: 0, wins: 0, hits: 0, atBats: 0 }
          };
        });
        window.__cloudBridge.usersCache = map;
        if (typeof window.onCloudUsersUpdated === 'function') window.onCloudUsersUpdated(map);
      }

      const { data: rankData, error: rErr } = await client.from('festival_rankings').select('*');
      if (rErr && throwOnError) throw rErr;
      if (!rErr && Array.isArray(rankData)) {
        window.__cloudBridge.rankingsCache = rankData.map(row => ({
          username: row.username,
          team: row.team || 'KIA',
          hr: row.hr ?? 0,
          wins: row.wins ?? 0,
          points: row.points ?? 0
        }));
        if (typeof window.onCloudRankingsUpdated === 'function') window.onCloudRankingsUpdated(window.__cloudBridge.rankingsCache);
      }
    }

    function updateCloudStatusBadge() {
      const el = document.getElementById('adminCloudStatus');
      if (el) el.textContent = window.__cloudBridge.statusText;
    }
    window.updateCloudStatusBadge = updateCloudStatusBadge;
    window.fetchSupabaseAll = fetchSupabaseAll;
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }

    @media (max-width: 640px) { .stadium-wrap { height: clamp(210px, calc(100vh - 330px), 300px); } }
    #threeCanvas, #canvas2D { width: 100%; height: 100%; display: block; }

    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 999px; }
  </style>
</head>

  <
